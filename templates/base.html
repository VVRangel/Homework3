<!DOCTYPE html>
<html>
<head>
    <title>Forum</title>
    <style>
        body{
            margin:0;
            font-family:Arial;
            background:#0f172a;
            color:white;
        }

        nav{
            background:#1e293b;
            padding:15px;
            display:flex;
            gap:15px;
            align-items:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            font-weight:bold;
        }

        .container{
            width:80%;
            margin:auto;
            padding:20px;
        }

        .card{
            background:#1e293b;
            padding:15px;
            margin:10px 0;
            border-radius:10px;
        }

        input,textarea{
            width:100%;
            padding:10px;
            margin:5px 0;
            background:#334155;
            color:white;
            border:none;
            border-radius:8px;
        }

        button{
            background:#3b82f6;
            border:none;
            padding:10px 15px;
            color:white;
            border-radius:8px;
            cursor:pointer;
        }

        a{
            color:#60a5fa;
        }

        .small{
            color:#94a3b8;
            font-size:12px;
        }
    </style>
</head>
<body>

<nav>
    <a href="/">Forum</a>

    {% if current_user.is_authenticated %}
        <a href="/create">Create</a>
        <a href="/logout">Logout</a>
    {% else %}
        <a href="/login">Login</a>
        <a href="/register">Register</a>
    {% endif %}
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
